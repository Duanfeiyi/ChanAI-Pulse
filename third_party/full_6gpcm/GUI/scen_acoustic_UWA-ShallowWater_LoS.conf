%Frequency = sub-6 GHz;  Scenario = acoustic UWA-ShallowWater;  Propagation_condition = / ;
Corr_distance   = 40;              	% correlation distance time birth death process settings
Corr_distance_A = 2;             	% antenna correlation distance
Corr_distance_F = 0;                 	% frequency correlation distance in second
no_snaps_update = 10000;			% explanation
lambdaG=30;                        	% generation rate in the birth-death process
lambdaR=1;                         	% recombination rate in the birth-death process
uwb_frequency_factor=0;      		% environment-dependent random variable，=0 不考虑大带宽场景下，功率随频率变化

