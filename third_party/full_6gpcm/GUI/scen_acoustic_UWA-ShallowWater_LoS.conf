PerClusterES_A =       7            % cluster elevation of arrival angle spread [deg]

AS_A_mu =              2.08         % azimuth of arrival angle spread [log10(deg)] @ 1 GHz
AS_A_sigma =           0.11         % azimuth of arrival angle spread STD [log10(deg)] 
