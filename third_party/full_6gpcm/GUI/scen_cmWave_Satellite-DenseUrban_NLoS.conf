%Frequency = cmWave;  Scenario = Satellite-DenseUrban;  Propagation_condition = NLoS;
Corr_distance = 100000;              	% correlation distance time birth death process settings 0: do not considering nonstationary in space|array domain.
Corr_distance_A = 0;             	% antenna correlation distance 0: do not considering nonstationary in time domain.
Corr_distance_F = 0;             	% antenna correlation distance 0: do not considering nonstationary in frequency domain.
lambdaG = 20;                        	% generation rate in the birth-death process
lambdaR = 1;                         	% recombination rate in the birth-death process
no_snaps_update=100;		     % explanation


