%Frequency = mmWave;  Scenario = Satellite-DenseUrban;  Propagation_condition = LoS;
Corr_distance   = 100000;                % correlation distance time birth death process settings
Corr_distance_A = 0;               % antenna correlation distance
Corr_distance_F = 0;                 % time correlation distance in second
lambdaG=20;                          % generation rate in the birth-death process
lambdaR=1;                           % recombination rate in the birth-death process
no_snaps_update=100;		     % explanation
  
LNS_ksi = 3            % per cluster shadowing STD [dB]
uwb_frequency_factor=0;              % environment-dependent random variable，=0 不考虑大带宽场景下，功率随频率变化
rain_rate = 0;				% explanation
d_Rx_min = 3;               		% the minimum distance between the cluster and the receiver
d_Rx_mean = 5;               		% the mean distance between the cluster and the receiver
d_Tx_min = 3;               		% the minimum distance between the cluster and the transmitter
d_Tx_mean = 5;               		% the mean distance between the cluster and the transmitter

SubpathMethod =        legacy       % subpath mapping method (legacy, Laplacian or mmMAGIC)
r_DS =                [2.5 2.5 2.5 2.5 2.5 2.5 2.5 2.5 2.5]             % delay scaling factor
DS_mu =               [-7.43 -7.62 -7.76 -8.02 -8.13 -8.30 -8.34 -8.39 -8.45]         % delay spread [log10(s)] @ 1 GHz, 57.3 deg elevation
DS_sigma =            [0.90 0.78 0.80 0.72 0.61 0.47 0.39 0.26 0.01]          % delay spread STD [log10(s)] 
DS_gamma =            -0.4          % freq.-dep. of DS [log10(s)/log10(GHz)]
DS_alpha =             0.4          % elevation-dep. of DS [log10(s)/log10(rad)]
KF_mu =               [6.1 13.7 12.9 10.3 9.2 8.4 8.0 7.4 7.6]        % Ricean K-factor [dB] @ 1 GHz, 57.3 deg elevation
KF_sigma =            [2.6 6.8 6.0 3.3 2.2 1.9 1.5 1.6 1.3]        % Ricean K-factor STD [dB] @ 1 GHz, 57.3 deg elevation
KF_gamma =             7.9          % freq.-dep. of KF [dB/log10(GHz)]
KF_alpha =            -10.95        % elevation-dep. of KF [dB/log10(rad)]
KF_delta =             2.2          % freq.-dep. of KF STD [dB/log10(GHz)]
KF_beta =             -2.65         % elevation-dep. of KF STD [dB/log10(rad)]
SF_sigma =             [2.9 2.4 2.7 2.4 2.4 2.7 2.6 2.8 0.6]         % Shadow Fading STD [dB] @ 57.3 deg elevation
SF_beta =             -0.6          % elevation-dep. of SF STD [dB/log10(rad)]
AS_D_mu =              [-3.43 -3.06 -2.91 -2.81 -2.74 -2.72 -2.46 -2.30 -1.11]         % azimuth of departure angle spread [log10(deg)] @ 1 GHz, 1 m TX-RX dist., 57.3 deg elevation
AS_D_sigma =           [0.54 0.41 0.42 0.34  0.34 0.70 0.40 0.78 0.51]           % azimuth of departure angle spread STD [log10(deg)] 
AS_D_gamma =          -0.4          % freq.-dep. of ASD [log10(deg)/log10(GHz)]
AS_D_epsilon =        -1            % TX-RX 2D dist.-dep. of ASD [log10(deg)/log10(m)]
AS_D_alpha =           0.3          % elevation-dep. of ASD [log10(deg)/log10(rad)]
AS_A_mu =              [0.65 0.53 0.60 0.43 0.36 0.16 0.18 0.24 0.36]          % azimuth of arrival angle spread [log10(deg)] @ 1 GHz, 57.3 deg elevation
AS_A_sigma =           [0.82 0.78 0.83 0.78 0.77 0.84 0.64 0.81 0.65]          % azimuth of arrival angle spread STD [log10(deg)] 
AS_A_gamma =          -0.4          % freq.-dep. of ASA [log10(deg)/log10(GHz)]
AS_A_alpha =           0.55         % elevation-dep. of ASA [log10(deg)/log10(rad)]
ES_D_mu =              [-2.75 -2.64 -2.49 -2.51 -2.54 -2.71 -2.85 -3.01 -3.08]         % elevation of departure angle spread [log10(deg)] @ 1 GHz, 1 m TX-RX dist., 57.3 deg elevation
ES_D_sigma =           [0.55 0.64 0.69 0.57 0.50 0.37 0.31 0.45 0.27]          % elevation of departure angle spread STD [log10(deg)] 
ES_D_gamma =          -0.4          % freq.-dep. of ESD [log10(deg)/log10(GHz)]
ES_D_epsilon =        -1            % TX-RX 2D dist.-dep. of ESD [log10(deg)/log10(m)]
ES_D_alpha =           0.5          % elevation-dep. of ESD [log10(deg)/log10(rad)]
ES_A_mu =              [0.82 0.47 0.80 1.23 1.42 1.56 1.65 1.73 1.79]          % elevation of arrival angle spread [log10(deg)] @ 1 GHz, 57.3 deg elevation
ES_A_sigma =           [0.05 0.11 0.05 0.04 0.10 0.06 0.07 0.02 0.01]          % elevation of arrival angle spread STD [log10(deg)] 
ES_A_gamma =          -0.4          % freq.-dep. of ESA [log10(deg)/log10(GHz)]
ES_A_alpha =           0.7          % elevation-dep. of ESA [log10(deg)/log10(rad)]
XPR_mu =               [24.7 24.4 24.4 24.2 23.9 23.3 22.6 21.2 17.6]        % cross-polarization ratio [dB] @ 57.3 deg elevation
XPR_sigma =            [2.1 2.8 2.7 2.7 3.1 3.9 4.8 6.8 12.7]        % cross-polarization ratio STD [dB] @ 57.3 deg elevation
XPR_alpha =           -13.45        % elevation-dep. of XPR [dB/log10(rad)]
XPR_beta =             8.85         % elevation-dep. of XPR STD [dB/log10(rad)]

PerClusterDS =         1.6          % cluster delay spread [ns]
PerClusterAS_D =       [0 0 0 0 0 0 0 0 0]            % cluster azimuth of departure angle spread [deg]
PerClusterAS_A =       [11 11 11 11 11 11 11 11 11]           % cluster azimuth of arrival angle spread [deg]
PerClusterES_D =       0            % cluster elevation of departure angle spread [deg]
PerClusterES_A =       [7 7 7 7 7 7 7 7 7]            % cluster elevation of arrival angle spread [deg]
DS_lambda =            50           % DS decorrelation distance [m]
KF_lambda =            50           % KF decorrelation distance [m]
SF_lambda =            50           % SF decorrelation distance [m]
AS_D_lambda =          50           % ASD decorrelation distance [m]
AS_A_lambda =          50           % ASD decorrelation distance [m]
ES_D_lambda =          50           % ESD decorrelation distance [m]
ES_A_lambda =          50           % ESD decorrelation distance [m]
XPR_lambda =           50           % XPR decorrelation distance [m]
ds_kf =               -0.8          % DS vs. KF
ds_sf =                0.2          % DS vs. SF
asD_ds =               0.8          % DS vs. ASD
asA_ds =               0.8          % DS vs. ASA
esD_ds =               0.8          % DS vs. ESD
esA_ds =               0.8          % DS vs. ESA
sf_kf =               -0.3          % KF vs. SF
asD_kf =              -0.8          % KF vs. ASD
asA_kf =              -0.8          % KF vs. ASA
esD_kf =              -0.8          % KF vs. ESD
esA_kf =              -0.8          % KF vs. ESA
asD_sf =               0.2          % SF vs. ASD
asA_sf =               0.2          % SF vs. ASA
esD_sf =               0.2          % SF vs. ESD
esA_sf =               0.2          % SF vs. ESA
asD_asA =              0.8          % ASD vs. ASA
esD_asD =              0.8          % ASD vs. ESD
esA_asD =              0.8          % ASD vs. ESA
esD_asA =              0.8          % ASA vs. ESD
esA_asA =              0.8          % ASA vs. ESA
esD_esA =              0.8          % ESD vs. ESA
PL_model =             satellite    % explanation
PL_A =                 20           % TX-RX 3D dist.-dep. of PL [dB/log10(m)]
PL_B =                 32.45        % reference PL in [dB] @ 1 GHz, 1 m TX-RX dist.
PL_C =                 20           % freq.-dep. of the PL in [dB/log10(GHz)]
PL_D =                 0            % Elevaion angle dep. of PL [dB/rad]
PL_usePLa =            1            % Enable/disable attenuation by atmospheric gases
CL =                [0 0 0 0 0 0 0 0 0]       %Clutter loss
BL_x_sb =		120	% Azimuth angular span of self-blocking region [deg]
BL_y_sb =		80 	% Elevation angular span of self-blocking region [deg]
BL_theta_sb =	100	% Elevation angle of self-blocking region in UT LCS [deg] 
BL_phi_sb =	260	% Azimuth angle of self-blocking region in UT LCS [deg]
BL_x_min = 	5	% Minimum azimuth angular span of non-self-blocking region [deg]
BL_x_max =	15	% Maximum azimuth angular span of non-self-blocking region [deg]
BL_y_min =	5	% Minimum elevation angular span of non-self-blocking region [deg]
BL_y_max =	5	% Maximum elevation angular span of non-self-blocking region [deg]
BL_theta_min =	90	% Minimum elevation angle of non-self-blocking region [deg]
BL_theta_max =	90	% Maximum elevation angle of non-self-blocking region [deg]
BL_phi_min =	0	% Minimum azimuth angle of non-self-blocking region [deg]
BL_phi_max =	360	% Maximum azimuth angle of non-self-blocking region [deg]
BL_r = 		10	% Distance r between the UT and the blocker [m]