%Frequency = sub-6 GHz;  Scenario = UHST;  Propagation_condition = /;
Corr_distance   = 40;              % correlation distance% % time birth death process settings
Corr_distance_A = 0;             % antenna correlation distance
Corr_distance_F = 0;                 % time correlation distance in second

lambdaG = 20;                         % generation rate in the birth-death process
lambdaR = 1;                         % recombination rate in the birth-death process

R =  2  %  the radius of tube [m]
d_Rx_min = 10;               % the minimum distance between the cluster and the receiver
d_Rx_mean = 10;               % the mean distance between the cluster and the receiver
d_Tx_min = 10;               % the minimum distance between the cluster and the transmitter
d_Tx_mean = 10;               % the mean distance between the cluster and the transmitter

r_DS =                 3.8          % delay scaling factor
