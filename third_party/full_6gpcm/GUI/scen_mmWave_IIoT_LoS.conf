%Frequency = mmWave;  Scenario = IIoT_LoS;  Propagation_condition = /;
eta = 3; % Power ratio between SMCs and DMCs. 
no_DMC = 3000; % The number of DMC paths

% the following parameters are consistent with the 6GPCM
Corr_distance   = 20;   % correlation distance% % time birth death process settings
Corr_distance_A = 0;    % antenna correlation distance, no cluster birth in the spatial domain
Corr_distance_F = 7;    % time correlation distance in second

lambdaG = 20;           % generation rate in the birth-death process
lambdaR = 1;            % recombination rate in the birth-death process
no_snaps_update = 1;   %explanation

r_DS =                 3            % delay scaling factor
LNS_ksi =              3            % per cluster shadowing STD [dB]

% Generally the strong clusters are within small distances bewteen Tx and Rx
d_Rx_min = 0.3;               % the minimum distance between the cluster and the receiver
d_Rx_mean = 5;               % the mean distance between the cluster and the receiver
d_Tx_min = 0.5;               % the minimum distance between the cluster and the transmitter
d_Tx_mean = 5;               % the mean distance between the cluster and the transmitter

% Large scale distributions
DS_mu =               -7.3       % delay spread [log10(s)] -> avg. of two hall size since LOS doesn't have a hall size specified
DS_sigma =             0.15         % delay spread STD [log10(s)] 

KF_mu =                3            % Ricean K-factor [dB] 
KF_sigma =             2            % Ricean K-factor STD [dB] 

SF_sigma =             4            % Shadow Fading STD [dB] 

AS_D_mu =              1.56         % azimuth of departure angle spread [log10(deg)] 
AS_D_sigma =           0.25         % azimuth of departure angle spread STD [log10(deg)] 

AS_A_mu =              1.78         % azimuth of arrival angle spread [log10(deg)]
AS_A_sigma =           0.2          % azimuth of arrival angle spread STD [log10(deg)] 
AS_A_omega =           1            % reference frequency offset for the ASA [GHz]
AS_A_gamma =          -0.18         % freq.-dep. of ASA [log10(deg)/log10(GHz)]
AS_A_delta =           0.12         % freq.-dep. of ASA STD [log10(deg)/log10(GHz)]

ES_D_mu =              1.35         % elevation of departure angle spread [log10(deg)] 
ES_D_sigma =           0.35         % elevation of departure angle spread STD [log10(deg)] 

ES_A_mu =              1.5          % elevation of arrival angle spread [log10(deg)] 
ES_A_sigma =           0.35         % elevation of arrival angle spread STD [log10(deg)] 
ES_A_omega =           1            % reference frequency offset for the ESA [GHz]
ES_A_gamma =          -0.2          % freq.-dep. of ESA [log10(deg)/log10(GHz)]
ES_A_delta =           0            % freq.-dep. of ESA STD [log10(deg)/log10(GHz)]

XPR_mu =               12           % cross-polarization ratio [dB] 
XPR_sigma =            6            % cross-polarization ratio STD [dB] 

% Large-Scale fading decorrelation distances
DS_lambda =            10           % DS decorrelation distance [m]
KF_lambda =            10           % KF decorrelation distance [m]
SF_lambda =            10           % SF decorrelation distance [m]
AS_D_lambda =          10           % ASD decorrelation distance [m]
AS_A_lambda =          10           % ASD decorrelation distance [m]
ES_D_lambda =          10           % ESD decorrelation distance [m]
ES_A_lambda =          10           % ESD decorrelation distance [m]
XPR_lambda =           5            % XPR decorrelation distance [m]

PerClusterAS_D =       5            % cluster azimuth of departure angle spread [deg]
PerClusterAS_A =       8            % cluster azimuth of arrival angle spread [deg]
PerClusterES_D =       7            % cluster elevation of departure angle spread [deg]
PerClusterES_A =       9            % cluster elevation of arrival angle spread [deg]
PerClusterDS_D =       50            % cluster elevation of arrival angle spread [deg]
power_decay_rate =       60e-9            % cluster elevation of arrival angle spread [deg]

% Decorrelation distance for the small-scale fading spatial consistency

SC_lambda =            10           % decorrelation distance [m]; 0 = disabled


% Inter-parameter correlations
asD_kf =              -0.5          % ASD vs. KF
ds_kf =               -0.7          % DS vs. KF

% Path-loss model
PL_model =             logdist  %explanation
PL_A =                 21.50        % TX-RX 3D dist.-dep. of PL [dB/log10(m)]
PL_B =                 31.84        % reference PL in [dB] @ 1 GHz, 1 m TX-RX dist.
PL_C =                 19           % freq.-dep. of the PL in [dB/log10(GHz)]

% Blockage-loss model
BL_x_sb =		120	% Azimuth angular span of self-blocking region [deg]
BL_y_sb =		80 	% Elevation angular span of self-blocking region [deg]
BL_theta_sb =	100	% Elevation angle of self-blocking region in UT LCS [deg] 
BL_phi_sb =	260	% Azimuth angle of self-blocking region in UT LCS [deg]
BL_x_min = 	15	% Minimum azimuth angular span of non-self-blocking region [deg]
BL_x_max =	45	% Maximum azimuth angular span of non-self-blocking region [deg]
BL_y_min =	5	% Minimum elevation angular span of non-self-blocking region [deg]
BL_y_max =	15	% Maximum elevation angular span of non-self-blocking region [deg]
BL_theta_min =	90	% Minimum elevation angle of non-self-blocking region [deg]
BL_theta_max =	90	% Maximum elevation angle of non-self-blocking region [deg]
BL_phi_min =	0	% Minimum azimuth angle of non-self-blocking region [deg]
BL_phi_max =	360	% Maximum azimuth angle of non-self-blocking region [deg]
BL_r = 		2	% Distance r between the UT and the blocker [m]

